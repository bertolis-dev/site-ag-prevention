<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demande envoyée — AG Prévention</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#151515">
<link rel="icon" href="img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--noir:#151515;--or:#B39455;--or-clair:#C9AE7C;--creme:#F2EDE2;--blanc:#FFFFFF}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--noir);color:var(--blanc);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:17px;line-height:1.6;padding:40px 24px}
.carte{max-width:560px;text-align:center}
.puce{width:66px;height:66px;margin:0 auto 26px;border-radius:50%;background:var(--or);display:flex;align-items:center;justify-content:center}
.puce svg{width:32px;height:32px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--or-clair);display:block;margin-bottom:16px}
h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.12;letter-spacing:-.015em;margin:0}
p{color:rgba(255,255,255,.82);margin:20px 0 0}
.btn{display:inline-block;margin-top:34px;padding:14px 28px;text-decoration:none;font-weight:600;font-size:15px;background:var(--or);color:var(--noir);border:1px solid var(--or)}
.btn:hover{background:var(--or-clair);border-color:var(--or-clair)}
a.mail{color:var(--or-clair);text-decoration:none}
</style>
</head>
<body>
  <div class="carte">
    <div class="puce" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#151515" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <span class="eyebrow">Demande de devis</span>
    <h1>Merci, votre demande est bien partie.</h1>
    <p>Nous revenons vers vous avec un devis détaillé sous <strong>24 h ouvrées</strong>. Une question d'ici là ? Écrivez-nous à <a class="mail" href="mailto:contact@ag-prevention.com">contact@ag-prevention.com</a>.</p>
    <a class="btn" href="index.html">Retour à l'accueil</a>
  </div>
</body>
</html>
