name: Déploiement du site (GitHub Pages)

# Publie le contenu du dépôt sur GitHub Pages à chaque push sur `main`.
# `configure-pages` active automatiquement Pages (build_type=workflow) la
# première fois, sans manipulation manuelle dans les réglages du dépôt.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer Pages (active Pages si besoin)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Déployer sur Pages
        id: deployment
        uses: actions/deploy-pages@v4
